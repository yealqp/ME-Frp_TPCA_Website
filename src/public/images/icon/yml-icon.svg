<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Yun-ME-FRP Launcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101A33"/>
      <stop offset="55%" stop-color="#0E1729"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.88" r="0.66">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#0F766E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#D7FBF2"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 云朵：三圆 + 圆角矩形求并集，底边统一落在 y≈668 -->
  <g fill="url(#cloud)">
    <circle cx="350" cy="573" r="130"/>
    <circle cx="512" cy="463" r="155"/>
    <circle cx="674" cy="567" r="132"/>
    <rect x="292" y="541" width="444" height="162" rx="81"/>
  </g>

  <!-- 穿透箭头：暗色描边做分离，内部填 teal 渐变 -->
  <g stroke="#0B1220" stroke-width="16" stroke-linejoin="round" fill="#0B1220">
    <rect x="168" y="487" width="628" height="66" rx="33"/>
    <path d="M758 440 L890 520 L758 600 Z"/>
  </g>
  <g fill="url(#arrow)">
    <rect x="168" y="487" width="628" height="66" rx="33"/>
    <path d="M758 440 L890 520 L758 600 Z"/>
  </g>
</svg>
